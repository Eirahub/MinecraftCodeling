name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A newer run for the same PR or branch replaces the old one; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Job limits (issue #252): a hung GameTest server once held a job for 35 minutes, and GitHub's default limit is 6 hours.
# A hung server stops its Gradle task after 10 minutes (gradle/loader.gradle.kts). Each limit is the normal time of the
# last green runs on develop, plus up to 5 minutes of setup with a cold cache (Minecraft download, Loom remap), plus that
# one 10-minute stop, so the job still ends with the gameTestHang message and is not cut off before it.
jobs:
  build:
    runs-on: ubuntu-latest
    # Normal time 8 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Text checks (em dash, CRLF in pxt API files)
        run: bash scripts/check-text.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            target/package-lock.json
            e2e/package-lock.json

      # buildtarget runs twice: the first run regenerates sims.d.ts but bundles the old API info.
      - name: Build pxt target (static editor)
        working-directory: target
        run: |
          npm ci
          npm run build
          npm run build
          npm run staticpkg

      # The Gradle daemon provisions Java 25 itself (gradle/gradle-daemon-jvm.properties), but the wrapper needs a JDK to start.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Stays on v5: v6 bundles a proprietary caching component under Gradle's Terms of Use; upgrade only after the owner accepts them.
      - uses: gradle/actions/setup-gradle@v5

      # :neoforge has its own job below.
      - name: Build core, common and fabric (includes the editor in the jar), JUnit tests and server GameTests (check runs :fabric:runGameTest)
        run: ./gradlew :core:build :common:26.3:build :fabric:26.3:build

      # Relay on old Java and libraries without Netty (#188): Java 17 with 1.20.1's Gson and SLF4J, Java 21 with 1.21.1's.
      # Gradle provisions both JDKs through the foojay resolver. Needs the packaged editor built above.
      - name: Relay compat check (Java 17 and 21, no Netty)
        run: ./gradlew :core:relayCompatTest

      # Editor suite (#136): every block round-trips, example programs run, old projects load, branding. The task
      # starts the standalone relay itself; it needs Node (set up above) and headless Chromium with its Linux libraries.
      # The apt package install may fail without failing the job: it mostly adds fonts, and a really missing library makes the browser fail to start below.
      - name: Editor test suite (headless Chromium against the standalone relay)
        run: |
          ./gradlew :fabric:26.3:installE2e
          (cd e2e && node node_modules/playwright-core/cli.js install-deps chromium-headless-shell) || echo "::warning::The Linux packages for Chromium could not be installed (apt unreachable?); the suite runs with what the image has."
          (cd e2e && node node_modules/playwright-core/cli.js install chromium-headless-shell)
          ./gradlew :fabric:26.3:editorTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/test-results/
            core/build/reports/
            fabric/versions/26.3/build/test-results/
            fabric/versions/26.3/build/reports/
            fabric/versions/26.3/build/run/gameTest/logs/
            fabric/versions/26.3/build/editor-test/

      - uses: actions/upload-artifact@v7
        with:
          name: codeling-jar
          path: fabric/versions/26.3/build/libs/*.jar

      - name: Upload packaged editor (for the NeoForge and client GameTests jobs)
        uses: actions/upload-artifact@v7
        with:
          name: editor-packaged
          path: target/built/packaged/
          retention-days: 1

  # NeoForge (#187): the jar (with the editor from the build job) and the NeoForge smoke GameTests. `build` runs
  # :neoforge:runGameTestServer through `check`; the full GameTest suite stays on Fabric.
  neoforge:
    needs: build
    runs-on: ubuntu-latest
    # Normal time 2 to 3 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: editor-packaged
          path: target/built/packaged/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the NeoForge jar and run the NeoForge GameTests
        run: ./gradlew :neoforge:26.3:build

      - name: Upload NeoForge GameTest report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-test-reports
          path: |
            neoforge/versions/26.3/build/test-results/
            neoforge/versions/26.3/run/gametest/logs/
            neoforge/versions/26.3/run/gametest/crash-reports/

      - uses: actions/upload-artifact@v7
        with:
          name: codeling-neoforge-jar
          path: neoforge/versions/26.3/build/libs/*.jar

  # Minecraft 1.21.1 (#189): the jar of each loader, built from the same sources by Stonecutter, and its GameTests
  # (`build` runs them through `check`: all 116 Codeling GameTests on Fabric, the 6 smoke GameTests on NeoForge).
  # Gradle provisions Java 21 through the foojay resolver. The client smokes open a game window, so they stay local.
  mc-1-21-1:
    needs: build
    runs-on: ubuntu-latest
    # Normal time 2 to 4 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: editor-packaged
          path: target/built/packaged/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the 1.21.1 jar and run its GameTests
        run: ./gradlew :${{ matrix.loader }}:1.21.1:build

      - name: Upload 1.21.1 test reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.loader }}-1.21.1-test-reports
          path: |
            ${{ matrix.loader }}/versions/1.21.1/build/test-results/
            ${{ matrix.loader }}/versions/1.21.1/build/run/gameTest/logs/
            ${{ matrix.loader }}/versions/1.21.1/run/gametest/logs/

      - uses: actions/upload-artifact@v7
        with:
          name: codeling-${{ matrix.loader }}-1.21.1-jar
          path: ${{ matrix.loader }}/versions/1.21.1/build/libs/*.jar

  # The other Minecraft versions (#206 to #213), the same way as 1.21.1. A job of its own so that the required
  # checks "mc-1-21-1 (fabric)" and "mc-1-21-1 (neoforge)" keep their names.
  mc-more:
    needs: build
    runs-on: ubuntu-latest
    # Normal time 2 to 4 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.1.2", "1.21.11", "1.21.10", "1.21.8", "1.21.5", "1.21.4", "1.21.3"]
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: editor-packaged
          path: target/built/packaged/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the ${{ matrix.mc }} jar and run its GameTests
        run: ./gradlew :${{ matrix.loader }}:${{ matrix.mc }}:build

      - name: Upload ${{ matrix.mc }} test reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.loader }}-${{ matrix.mc }}-test-reports
          path: |
            ${{ matrix.loader }}/versions/${{ matrix.mc }}/build/test-results/
            ${{ matrix.loader }}/versions/${{ matrix.mc }}/build/run/gameTest/logs/
            ${{ matrix.loader }}/versions/${{ matrix.mc }}/run/gametest/logs/

      - uses: actions/upload-artifact@v7
        with:
          name: codeling-${{ matrix.loader }}-${{ matrix.mc }}-jar
          path: ${{ matrix.loader }}/versions/${{ matrix.mc }}/build/libs/*.jar

  # Client GameTests start a real Minecraft client (2 to 3 GB), so they run on main and on demand only.
  client-gametest:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A client that cannot open a window hangs instead of exiting; GitHub's default timeout is 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: editor-packaged
          path: target/built/packaged/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # The end-to-end client GameTest (#135) runs e2e/editor-run.mjs in headless Chromium through playwright-core.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # :fabric:26.3:installE2e is npm ci in e2e/ (runClientGameTest also depends on it); then the browser and its Linux libraries.
      # The apt package install may fail without failing the job: it mostly adds fonts, and a really missing library makes the browser fail to start.
      - name: Install e2e dependencies and headless Chromium
        run: |
          ./gradlew :fabric:26.3:installE2e
          (cd e2e && node node_modules/playwright-core/cli.js install-deps chromium-headless-shell) || echo "::warning::The Linux packages for Chromium could not be installed (apt unreachable?); the suite runs with what the image has."
          cd e2e && node node_modules/playwright-core/cli.js install chromium-headless-shell

      # The task name must match what issue #134 creates (fabric-client-gametest-api-v1, task runClientGameTest).
      # With CI set, Loom starts the client under its own xvfb-run. Xvfb's GLX has no sRGB-capable visual, which the
      # 26.3 OpenGL backend asks for, so the client falls back to Vulkan; mesa-vulkan-drivers gives it lavapipe
      # (Fabric API's CI does the same). Without a Vulkan driver both backends fail and the client hangs.
      - name: Client GameTests under a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          ./gradlew :fabric:26.3:runClientGameTest

      # The run directory path must match #134's run config; it holds logs and screenshots.
      - name: Upload client test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-reports
          path: |
            fabric/versions/26.3/build/test-results/
            fabric/versions/26.3/build/run/clientGameTest/logs/
            fabric/versions/26.3/build/run/clientGameTest/screenshots/
